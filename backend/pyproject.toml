[project]
name = "ironlog-backend"
version = "1.0.0"
description = "Iron Log API: self-hosted workout and body tracker"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "UP042"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]
"scripts/*" = ["E501"]
